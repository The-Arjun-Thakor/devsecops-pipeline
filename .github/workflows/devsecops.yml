name: devsecops

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly re-scan: new CVEs are published even when your code does not change.
    - cron: "0 5 * * 1"

# Least privilege for the automatic GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ quality
  test:
    name: Unit tests + coverage gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Test (fails below 90% coverage)
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=90

  # --------------------------------------------------------------------- SAST
  sast:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install "bandit==1.9.4"

      # -ll = report/fail on MEDIUM severity and above. Training examples in demo/ are not scanned.
      - name: Scan application code
        run: bandit -r app -x app/tests -ll

  # -------------------------------------------------------------- dependencies
  dependencies:
    name: SCA - known vulnerable dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install "pip-audit==2.10.1"

      # Fully pinned requirements.txt, so no dependency resolution is needed.
      - name: Audit pinned dependencies
        run: pip-audit -r app/requirements.txt --no-deps --disable-pip

  # ------------------------------------------------------------------ secrets
  secrets:
    name: Secret scanning - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full history, not just the latest commit

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Note: free for personal accounts; organisation repos need a GITLEAKS_LICENSE secret.

  # ------------------------------------------------------------------ IaC / CI
  config-scan:
    name: Dockerfile + workflow configuration - Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install "checkov==3.3.27"

      - name: Scan Dockerfile and GitHub Actions workflows
        run: checkov -d . --framework dockerfile github_actions --quiet --compact

  # ---------------------------------------------------------------- container
  container:
    name: Container - lint, build, scan, SBOM, runtime smoke test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile (Hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold warning - < app/Dockerfile

      - name: Build image
        run: docker build -t devsecops-demo:${{ github.sha }} app

      # Gate: fail on HIGH/CRITICAL vulnerabilities that already have a fix available.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-demo:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Software Bill of Materials: an inventory of every component in the image,
      # so you can answer "are we affected?" quickly when the next Log4Shell appears.
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-demo:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      # Run the image the way production should: read-only filesystem, no
      # capabilities, no privilege escalation. Proves the hardening actually works.
      - name: Runtime smoke test (hardened container)
        run: |
          docker run -d --name app -p 8000:8000 \
            -e API_KEY=ci-only-key \
            --read-only --tmpfs /data:rw,noexec,nosuid,uid=10001 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            devsecops-demo:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fs http://127.0.0.1:8000/healthz && break || sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/tasks)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-API-Key: ci-only-key' http://127.0.0.1:8000/tasks)" = "200"
          docker logs app
          docker rm -f app

      # If the smoke test fails, show what the container itself said.
      - name: Show container logs on failure
        if: failure()
        run: docker logs app || true
